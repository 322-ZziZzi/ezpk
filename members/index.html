<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
  <meta name="theme-color" content="#05070b">
  <title>322 EZPK Members</title><script data-ezpk-theme-bootstrap>
(function(){
  var h=String(location.hostname||'').toLowerCase();
  var local=(location.protocol==='file:'||h==='localhost'||h==='127.0.0.1'||h==='0.0.0.0'||/^10\.|^192\.168\.|^172\.(1[6-9]|2\d|3[01])\./.test(h));
  var forced=local?new URLSearchParams(location.search).get('__site'):'';
  var context=document.documentElement.getAttribute('data-theme-context')||'';
  var site=context==='gateway'?'gateway':(h==='ezpk2.ezpk322.com'?'ezpk2':'ezpk1');
  if(local&&forced==='ezpk2')site='ezpk2';
  else if(local&&forced==='ezpk1')site='ezpk1';
  else if(local&&forced==='gateway')site='gateway';
  document.documentElement.dataset.site=site;
  document.documentElement.style.colorScheme=site==='ezpk2'?'light':'dark';
  var themeColor=site==='ezpk2'?'#f1f4f8':'#05070b';
  var meta=document.querySelector('meta[name="theme-color"]');
  if(!meta){meta=document.createElement('meta');meta.name='theme-color';document.head.appendChild(meta);}
  meta.content=themeColor;
  if(site==='ezpk2'&&document.title&&!/^EZPK2\b/.test(document.title)){document.title='EZPK2 · '+document.title.replace(/\s*[·|]\s*EZPK\b/g,'').replace(/^322\s+EZPK\s*/,'').trim();}
  window.__EZPK_SITE__=site;
})();
</script>

</head>
<body>
<header class="site-header" data-shared-header data-base=".." data-home-href="../#home" data-active-menu="members"></header><script src="../shared-header.js?v=4080"></script>
<main class="members-main">
  <section class="members-hero">
    <span class="eyebrow">EZPK ALLIANCE</span>
    <h1 id="membersTitle"></h1>
    <p id="membersLead"></p>
    <div class="member-summary">
      <div><span id="totalLabel"></span><strong id="totalMembers">0</strong></div>
      <div><span id="totalPowerLabel"></span><strong id="totalPower">0</strong></div>
      <div><span id="avgPowerLabel"></span><strong id="avgPower">0</strong></div>
    </div>
  </section>
  <section class="members-content">
    <div id="memberViewSwitch" class="member-view-switch" hidden>
      <button id="tierViewButton" type="button" data-member-view="tier"></button>
      <button id="generalViewButton" type="button" data-member-view="general"></button>
    </div>
    <div class="member-tools">
      <input id="memberSearch" type="search" autocomplete="off">
      <select id="rankFilter" aria-label="Rank filter"></select>
      <div class="sort-wrap">
        <label id="sortLabel" for="sortMembers"></label>
        <select id="sortMembers"></select>
      </div>
      <button id="findMyCard" class="find-my-card" type="button" hidden></button>
    </div>
    <div id="memberGroups" class="member-groups"></div>
    <div id="emptyState" class="empty-state" hidden></div>
    <div id="vehicleLegend" class="vehicle-legend" hidden>
      <span>⚔️ Fighter</span><span>🎯 Shooter</span><span>🏍️ Rider</span>
    </div>
  </section>
</main>
<footer><b>322 EZPK ALLIANCE</b><span id="memberFooter"></span></footer>
