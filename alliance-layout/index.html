<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
  <meta name="theme-color" content="#05070b">
  <title>EZPK Alliance Layout</title><script data-ezpk-theme-bootstrap>
(function(){
  var h=String(location.hostname||'').toLowerCase();
  var local=(location.protocol==='file:'||h==='localhost'||h==='127.0.0.1'||h==='0.0.0.0'||/^10\.|^192\.168\.|^172\.(1[6-9]|2\d|3[01])\./.test(h));
  var forced=local?new URLSearchParams(location.search).get('__site'):'';
  var context=document.documentElement.getAttribute('data-theme-context')||'';
  var site=context==='gateway'?'gateway':(h==='ezpk2.ezpk322.com'?'ezpk2':'ezpk1');
  if(local&&forced==='ezpk2')site='ezpk2';
  else if(local&&forced==='ezpk1')site='ezpk1';
  else if(local&&forced==='gateway')site='gateway';
  document.documentElement.dataset.site=site;
  document.documentElement.style.colorScheme=site==='ezpk2'?'light':'dark';
  var themeColor=site==='ezpk2'?'#f1f4f8':'#05070b';
  var meta=document.querySelector('meta[name="theme-color"]');
  if(!meta){meta=document.createElement('meta');meta.name='theme-color';document.head.appendChild(meta);}
  meta.content=themeColor;
  if(site==='ezpk2'&&document.title&&!/^EZPK2\b/.test(document.title)){document.title='EZPK2 · '+document.title.replace(/\s*[·|]\s*EZPK\b/g,'').replace(/^322\s+EZPK\s*/,'').trim();}
  window.__EZPK_SITE__=site;
})();
</script>
  <link rel="stylesheet" href="../style.css?v=4030">
  <link rel="stylesheet" href="../common-heading.css?v=4010">
  <link rel="stylesheet" href="alliance-layout.css?v=3770">
<link rel="stylesheet" href="/ezpk-theme.css?v=4070">
</head>
<body>
  <header class="site-header" data-shared-header data-base=".." data-home-href="../#home" data-active-menu="allianceLayout"></header>
  <script src="../shared-header.js?v=4070"></script>

  <main class="alliance-layout-main">
    <section id="allianceLayoutGate" class="member-gate-wrap" hidden>
      <div class="member-gate-card">
        <div class="member-gate-icon" aria-hidden="true">🔐</div>
        <h1 id="gateTitle" class="member-gate-title"></h1>
        <p id="gateLead" class="member-gate-description"></p>
        <div class="member-login-actions">
          <button id="gateLogin" type="button" class="member-login-primary"></button>
        </div>
      </div>
    </section>

    <div id="allianceLayoutProtected" hidden>
      <section class="alliance-layout-hero">
        <h1 id="pageTitle"></h1>
        <p id="pageLead"></p>
      </section>

      <section class="layout-summary" aria-label="">
        <article><span id="placedLabel"></span><strong id="placedCount">—</strong></article>
        <article><span id="publishedLabel"></span><strong id="publishedDate">—</strong></article>
      </section>

      <section id="layoutState" class="layout-state" aria-live="polite"></section>

      <section id="layoutContent" hidden>
        <div class="mobile-layout-overview">
          <div class="overview-heading"><span id="overviewTitle"></span><small id="overviewHint"></small></div>
          <div id="miniLayoutMap" class="mini-layout-map" dir="ltr"></div>
          <button id="openFullscreen" type="button" class="open-fullscreen"></button>
          <button type="button" class="layout-image-view" data-layout-image></button>
        </div>

        <section id="layoutExplorer" class="layout-explorer">
          <header class="explorer-header">
            <button id="closeFullscreen" class="fullscreen-back" type="button" aria-label="">←</button>
            <div><strong id="mapTitle"></strong><small id="mapGestureHint"></small></div>
            <div class="desktop-layout-zoom" aria-label="">
              <button type="button" data-layout-zoom="out"><span aria-hidden="true">−</span><em data-zoom-label="out"></em></button>
              <button type="button" data-layout-zoom="in"><span aria-hidden="true">＋</span><em data-zoom-label="in"></em></button>
              <button type="button" data-layout-zoom="reset"><span aria-hidden="true">↺</span><em data-zoom-label="reset"></em></button>
            </div>
            <span id="fullscreenCount" class="fullscreen-count"></span>
          </header>
          <div class="layout-tools">
            <div class="member-search-wrap">
              <input id="memberSearch" type="search" autocomplete="off" aria-label="">
              <div id="searchResults" class="search-results" hidden></div>
            </div>
            <button id="findMe" type="button" class="find-me"></button>
            <button type="button" class="layout-image-view" data-layout-image></button>
          </div>
          <div class="mobile-layout-zoom" aria-label="">
            <div><button type="button" data-layout-zoom="out" aria-label="">−</button><button type="button" data-layout-zoom="in" aria-label="">＋</button><button type="button" data-layout-zoom="reset" aria-label="">↺</button></div>
            <span data-layout-zoom-value>100%</span>
          </div>
          <div id="mapViewport" class="layout-map-viewport" dir="ltr">
            <div id="mapStage" class="layout-map-stage">
              <div id="layoutMap" class="layout-map-grid"></div>
            </div>
          </div>
          <aside id="memberDetail" class="member-detail" hidden aria-live="polite">
            <div class="detail-grabber" aria-hidden="true"></div>
            <strong id="detailNickname"></strong>
            <div class="detail-specs"><span><b>CP</b><em id="detailCp"></em></span><span><b>IND</b><em id="detailInd"></em></span></div>
          </aside>
        </section>

        <details id="layoutGuide" class="layout-guide" open>
          <summary id="guideTitle"></summary>
          <ol>
            <li id="guide1"></li>
            <li id="guide2"></li>
            <li id="guide3"></li>
            <li id="guide4"></li>
            <li id="guide5"></li>
          </ol>
        </details>

        <dialog id="layoutImageDialog" class="layout-image-dialog">
          <header>
            <div><strong id="layoutImageTitle"></strong><small id="layoutImageGuide"></small></div>
            <button id="layoutImageClose" type="button" aria-label="">×</button>
          </header>
          <div id="layoutImageState" class="layout-image-state" aria-live="polite"></div>
          <img id="layoutImagePreview" alt="" draggable="false">
        </dialog>
      </section>
    </div>
  </main>
  <script src="alliance-layout.js?v=3770"></script>
</body>
</html>
