<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><meta name="theme-color" content="#05070b"><title>EZPK Request Board</title><link rel="stylesheet" href="../style.css?v=3340"><link rel="stylesheet" href="request.css?v=1902"><link rel="stylesheet" href="../common-heading.css?v=1020">
<style>
@media (min-width:901px){
.bgb-filter select.sort-select,.bgb-filter select.grade-select{width:180px!important;}
}
@media (max-width:900px){
.bgb-filter input,.bgb-filter select{width:100%!important;box-sizing:border-box!important;display:block;}
}

.spec-item{display:flex;align-items:center;gap:6px;}
.spec-icon{flex-shrink:0;}
</style>
</head><body>
<header class="site-header" data-shared-header data-base=".." data-home-href="../#home" data-active-menu="request"></header><script src="../shared-header.js?v=3340"></script>
<main class="request-main"><section id="requestLock" class="member-gate-wrap" hidden><div class="member-gate-card"><div class="member-gate-icon">🔐</div><span class="member-gate-section" data-member-gate-section></span><h1 class="member-gate-title" data-member-gate-title></h1><p class="member-gate-description" data-member-gate-lead></p><div class="member-login-actions"><button type="button" class="member-login-primary" data-member-login></button><a class="member-login-secondary" href="../signup/" data-member-signup></a></div><p class="member-gate-error" data-member-gate-error></p></div></section>
<div id="requestProtected" hidden>
<section class="request-hero"><span class="eyebrow">SERVER 322 · EZPK ALLIANCE</span><h1 id="requestTitle">요청 게시판</h1><p id="requestLead">연맹 운영진에게 요청사항이나 질문을 남겨주세요.</p></section>
<section class="request-layout"><form id="requestForm" class="request-form"><div class="request-form-head"><span>NEW REQUEST</span><h2 id="writeTitle">요청 작성</h2></div><label><span id="titleLabel">제목</span><input id="requestPostTitle" maxlength="120" required></label><label><span id="messageLabel">내용</span><textarea id="requestMessage" maxlength="3000" rows="7" required></textarea></label><div class="request-counter"><span id="authorHint">로그인한 닉네임으로 등록됩니다.</span><strong id="messageCount">0 / 3000</strong></div><button id="requestSubmit" class="request-submit" type="submit">등록하기</button><div id="requestFormStatus" class="request-status"></div></form>
<section class="request-list-card"><div class="request-list-head"><div><span>REQUEST LIST</span><h2 id="recentTitle">요청 목록</h2><small id="requestTotal">총 요청글 0개</small></div><button id="requestRefresh" type="button">↻</button></div><div id="requestList" class="board-list"></div><nav id="requestPagination" class="request-pagination" hidden><button id="requestPrev" type="button">◀ 이전</button><strong id="requestPageState">1 / 1</strong><button id="requestNext" type="button">다음 ▶</button></nav></section></section>
</div></main><footer><b>322 EZPK ALLIANCE</b><span>Request Board</span></footer>
<dialog id="requestEditDialog" class="request-dialog"><form method="dialog" id="requestEditForm"><h3 id="editDialogTitle">요청글 수정</h3><input id="editRequestId" type="hidden"><label><span>제목</span><input id="editRequestTitle" maxlength="120" required></label><label><span>내용</span><textarea id="editRequestMessage" maxlength="3000" rows="8" required></textarea></label><div class="dialog-actions"><button value="cancel" type="button" id="editCancel">취소</button><button value="save" class="primary" type="submit">저장</button></div><p id="editRequestStatus" class="request-status"></p></form></dialog>
<script src="../data.js?v=1530"></script><script src="request.js?v=1902"></script></body></html>
