<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
  <meta name="theme-color" content="#05070b">
  <title>SIGN UP · EZPK</title>
  <link rel="stylesheet" href="../style.css?v=3330">
  <link rel="stylesheet" href="./signup.css?v=2240">

<style>
@media (min-width:901px){
.bgb-filter select.sort-select,.bgb-filter select.grade-select{width:180px!important;}
}
@media (max-width:900px){
.bgb-filter input,.bgb-filter select{width:100%!important;box-sizing:border-box!important;display:block;}
}

.spec-item{display:flex;align-items:center;gap:6px;}
.spec-icon{flex-shrink:0;}
</style>
</head>
<body>
  <header class="site-header" data-shared-header data-base=".." data-home-href="../" data-active-menu=""></header>
  <script src="../shared-header.js?v=3330"></script>

  <main class="signup-shell">
    <section class="signup-hero">
      <p class="signup-eyebrow">EZPK MEMBER</p>
      <h1 data-i18n="title">회원가입</h1>
      <p data-i18n="subtitle">연맹원 계정을 생성합니다.</p>
    </section>

    <section class="signup-card">
      <form id="signupForm" class="signup-form" novalidate>
        <label>
          <span data-i18n="loginId">아이디</span>
          <input name="loginId" type="text" minlength="4" maxlength="32"
            autocomplete="username" autocapitalize="none" spellcheck="false"
            placeholder="ezpk_member" required>
          <small data-i18n="loginHelp">4~32자의 영문 소문자, 숫자, 점, 밑줄, 하이픈을 사용할 수 있습니다.</small>
        </label>

        <label>
          <span data-i18n="password">비밀번호</span>
          <div class="password-wrap">
            <input name="password" type="password" minlength="8" maxlength="128"
              autocomplete="new-password" required>
            <button type="button" class="password-toggle" data-toggle="password">◉</button>
          </div>
          <small data-i18n="passwordHelp">영문과 숫자를 포함해 8자 이상 입력하세요.</small>
        </label>

        <label>
          <span data-i18n="passwordConfirm">비밀번호 확인</span>
          <div class="password-wrap">
            <input name="passwordConfirm" type="password" minlength="8" maxlength="128"
              autocomplete="new-password" required>
            <button type="button" class="password-toggle" data-toggle="passwordConfirm">◉</button>
          </div>
        </label>

        <label>
          <span data-i18n="nickname">닉네임</span>
          <input name="nickname" type="text" maxlength="64" autocomplete="nickname" required>
          <small class="field-help" data-i18n="nicknameHelp">게임 닉네임</small>
        </label>
        <label>
          <span data-i18n="joinCode">연맹 가입 코드</span>
          <input name="allianceCode" type="password" maxlength="100" autocomplete="off" required>
          <small class="field-help" data-i18n="joinCodeHelp">R5 또는 R4에게 문의</small>
        </label>

        <p id="signupError" class="signup-error" role="alert" hidden></p>
        <button id="signupSubmit" class="signup-submit" type="submit" data-i18n="submit">회원가입</button>
      </form>

      <div class="login-link">
        <span data-i18n="haveAccount">이미 계정이 있으신가요?</span>
        <button type="button" id="openLogin" data-i18n="login">로그인</button>
      </div>
    </section>
  </main>

  <div id="signupToast" class="signup-toast" role="status" aria-live="polite" hidden></div>
  <script src="./signup.js?v=2240"></script>
</body>
</html>
