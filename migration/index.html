<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
  <meta name="theme-color" content="#05070b">
  <title>EZPK Migration</title><script data-ezpk-theme-bootstrap>
(function(){
  var h=String(location.hostname||'').toLowerCase();
  var local=(location.protocol==='file:'||h==='localhost'||h==='127.0.0.1'||h==='0.0.0.0'||/^10\.|^192\.168\.|^172\.(1[6-9]|2\d|3[01])\./.test(h));
  var forced=local?new URLSearchParams(location.search).get('__site'):'';
  var context=document.documentElement.getAttribute('data-theme-context')||'';
  var site=context==='gateway'?'gateway':(h==='ezpk2.ezpk322.com'?'ezpk2':'ezpk1');
  if(local&&forced==='ezpk2')site='ezpk2';
  else if(local&&forced==='ezpk1')site='ezpk1';
  else if(local&&forced==='gateway')site='gateway';
  document.documentElement.dataset.site=site;
  document.documentElement.style.colorScheme=site==='ezpk2'?'light':'dark';
  var themeColor=site==='ezpk2'?'#f1f4f8':'#05070b';
  var meta=document.querySelector('meta[name="theme-color"]');
  if(!meta){meta=document.createElement('meta');meta.name='theme-color';document.head.appendChild(meta);}
  meta.content=themeColor;
  if(site==='ezpk2'&&document.title&&!/^EZPK2\b/.test(document.title)){document.title='EZPK2 · '+document.title.replace(/\s*[·|]\s*EZPK\b/g,'').replace(/^322\s+EZPK\s*/,'').trim();}
  window.__EZPK_SITE__=site;
})();
</script>
  <link rel="stylesheet" href="../style.css?v=4210">
  <link rel="stylesheet" href="../common-heading.css?v=4150">
  <link rel="stylesheet" href="migration.css?v=4150">
<link rel="stylesheet" href="/ezpk-theme.css?v=4150">
  <link rel="stylesheet" href="/text-fit-v419.css?v=4190">
  <link rel="stylesheet" href="/header-fit-v422.css?v=4220">
</head>
<body class="migration-auth-pending">
  <header class="site-header" data-shared-header data-base=".." data-home-href="../" data-active-menu="immigration"></header>
    <script src="/language-core-v417.js?v=4170"></script>
<script src="/i18n-v414.js?v=4170"></script>
<script src="../shared-header.js?v=4220"></script><script src="/header-fit-v422.js?v=4220"></script>

  <main id="migrationApp" class="migration-main" hidden>
    <section class="migration-hero">
      <h1 data-migration-k="heroTitle"></h1>
      <p data-migration-k="heroBody"></p>
    </section>

    <section id="migrationDisabled" class="migration-disabled" hidden aria-live="polite">
      <span class="migration-disabled-kicker" data-migration-k="intakeClosedKicker"></span>
      <h2 data-migration-k="intakeClosedTitle"></h2>
      <p data-migration-k="intakeClosedBody"></p>
      <a class="migration-button migration-button-secondary migration-disabled-home" href="../" data-migration-k="home"></a>
      <div id="migrationDisabledStatusArea" class="migration-status-area migration-disabled-status-area"></div>
    </section>

    <section id="migrationEligibility" class="migration-eligibility" hidden aria-live="polite">
      <div class="migration-eligibility-head">
        <span data-migration-k="eligibilityKicker"></span>
        <h2 data-migration-k="eligibilityTitle"></h2>
        <p data-migration-k="eligibilityBody"></p>
      </div>
      <div class="migration-eligibility-rules">
        <div class="migration-eligibility-rule"><span data-migration-k="eligibilityVehicle"></span><strong id="eligibilityVehicleValue">-</strong></div>
        <div class="migration-eligibility-rule"><span data-migration-k="eligibilityIndustry"></span><strong id="eligibilityIndustryValue">-</strong></div>
      </div>
      <div id="migrationEzpk2Cta" class="migration-ezpk2-cta" hidden>
        <p data-migration-k="ezpk2CtaBody"></p>
        <a id="migrationEzpk2Link" class="migration-button migration-button-secondary" href="#" data-migration-k="ezpk2CtaButton" hidden aria-hidden="true"></a>
      </div>
    </section>

    <section id="migrationFormShell" class="migration-shell" aria-live="polite">
      <header class="migration-progress-header">
        <div>
          <span id="migrationStepCounter" class="migration-step-counter"></span>
          <h2 id="migrationStepTitle"></h2>
          <p id="migrationStepDescription"></p>
        </div>
        <div class="migration-progress-track" aria-hidden="true"><span id="migrationProgressBar"></span></div>
      </header>

      <form id="migrationForm" novalidate>
        <input id="migrationHoneypot" name="website" class="migration-honeypot" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div id="migrationStepBody" class="migration-step-body"></div>
        <div id="migrationSubmitError" class="migration-submit-error" role="alert" hidden></div>
        <footer class="migration-actions">
          <button id="migrationPrev" class="migration-button migration-button-secondary" type="button"></button>
          <button id="migrationNext" class="migration-button migration-button-primary" type="button"></button>
        </footer>
        <div id="migrationStatusArea" class="migration-status-area" hidden></div>
      </form>
    </section>

    <section id="migrationSuccess" class="migration-success" hidden>
      <div class="migration-success-icon" aria-hidden="true">✓</div>
      <h2 data-migration-k="successTitle"></h2>
      <p data-migration-k="successBody1"></p>
      <p data-migration-k="successBody2"></p>
      <p class="migration-success-note" data-migration-k="successBody3"></p>
      <a class="migration-button migration-button-primary migration-success-home" href="../" data-migration-k="home"></a>
    </section>
  </main>

  <script src="migration.js?v=4170"></script>
  <script src="/text-fit-v419.js?v=4190"></script>
</body>
</html>
