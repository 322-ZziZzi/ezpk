<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes" name="viewport"/>
<meta content="#05070b" name="theme-color"/>
<title>MY PAGE · EZPK</title>
<link href="../style.css?v=3560" rel="stylesheet"/>
<link href="./my.css?v=2930" rel="stylesheet"/>
<style>
@media (min-width:901px){
.bgb-filter select.sort-select,.bgb-filter select.grade-select{width:180px!important;}
}
@media (max-width:900px){
.bgb-filter input,.bgb-filter select{width:100%!important;box-sizing:border-box!important;display:block;}
}

.spec-item{display:flex;align-items:center;gap:6px;}
.spec-icon{flex-shrink:0;}
</style>
</head>
<body>
<header class="site-header" data-active-menu="" data-base=".." data-home-href="../" data-shared-header=""></header>
<script src="../shared-header.js?v=3560"></script>
<main class="portal-page my-shell" id="myPage">
<section class="portal-page-hero my-hero">
<p class="portal-eyebrow my-eyebrow">EZPK MEMBER CENTER</p>
<h1 data-i18n="title">마이페이지</h1>
<p data-i18n="subtitle">내 프로필과 계정 정보를 관리합니다.</p>
</section>
<section class="portal-card portal-state-panel state-panel" id="loadingPanel">
<div aria-hidden="true" class="spinner"></div>
<p data-i18n="loading">회원 정보를 불러오는 중입니다.</p>
</section>
<section class="portal-card portal-state-panel state-panel" hidden="" id="authRequiredPanel">
<h2 data-i18n="loginRequired">로그인이 필요합니다.</h2>
<p data-i18n="loginRequiredBody">로그인 후 마이페이지를 이용할 수 있습니다.</p>
<button class="portal-button portal-button-primary primary-link" data-i18n="loginButton" id="myLoginButton" type="button">로그인</button>
</section>
<div class="my-content-stack" hidden="" id="memberContent">
<section aria-label="Member summary" class="portal-card member-card">
<div aria-hidden="true" class="member-avatar rank-r1" id="summaryAvatar"><span class="rank-member-icon"></span></div>
<div class="member-main">
<strong id="summaryNickname">-</strong>
<span class="role-badge" id="summaryRole">-</span>
</div>
<dl class="member-stats">
<div><dt data-i18n="power">전투력</dt><dd id="summaryPower">-</dd></div>
<div><dt data-i18n="industry">산업 레벨</dt><dd id="summaryIndustry">-</dd></div>
</dl>
</section>
<section class="accordion-list"><section class="my-menu-group" data-group="info"><h2 class="my-menu-group-title">내 정보</h2><div class="portal-card my-menu-group-card"><article class="accordion-item" data-section="profile">
<button aria-expanded="false" class="accordion-trigger" type="button">
<span><span aria-hidden="true" class="menu-svg-icon icon-user"></span><span data-i18n="basicProfile">기본 프로필</span></span>
<span class="chevron">›</span>
</button>
<div class="accordion-panel" hidden="">
<div class="portal-form form-stack profile-readonly" id="profileForm">
<label><span data-i18n="loginId">로그인 아이디</span><input disabled="" id="profileLoginId" type="text"/></label>
<label><span data-i18n="nickname">닉네임</span><input disabled="" id="profileNickname" type="text"/></label>
<label><span data-i18n="memberRank">회원 등급</span>
<input aria-readonly="true" disabled="" id="profileRankDisplay" type="text" value="R1"/>
</label>
</div>
</div>
</article><article class="accordion-item is-open" data-section="specs">
<button aria-expanded="true" class="accordion-trigger" type="button">
<span><span aria-hidden="true" class="menu-svg-icon icon-sliders"></span><span data-i18n="detailedSpecs">세부 스펙</span></span>
<span class="chevron">⌄</span>
</button>
<div class="accordion-panel">
<form class="portal-form form-stack" id="specsForm">
<label class="profile-power-field"><span data-i18n="profilePower">전투력 (프로필에 표시된 수치)</span>
<input autocomplete="off" id="specsProfilePower" inputmode="numeric" name="power" placeholder="-" required="" type="text"/>
</label>
<label class="industry-level-field"><span data-i18n="industry">산업 레벨</span>
<select name="industryLevel" required="">
<option disabled="" selected="" value="">-</option><option value="I10">i10</option><option value="I9">i9</option><option value="I8">i8</option><option value="I7">i7</option><option value="I6">i6</option>
<option value="I5">i5</option><option value="I4">i4</option><option value="I3">i3</option><option value="I2">i2</option><option value="I1">i1</option>
</select>
</label>
<fieldset>
<legend data-i18n="vehicle1">차량 1</legend>
<label><span data-i18n="class">병종</span>
<select name="vehicle1Class"><option value="">-</option><option value="fighter">Fighter</option><option value="shooter">Shooter</option><option value="rider">Rider</option></select>
</label>
<div class="two-field">
<label><span data-i18n="power">전투력</span><input inputmode="decimal" min="0" name="vehicle1PowerValue" step="0.01" type="number"/></label>
<label><span data-i18n="unit">단위</span><select name="vehicle1PowerUnit"><option value="">-</option><option>M</option><option>G</option></select></label>
</div>
</fieldset>
<fieldset>
<legend data-i18n="vehicle2">차량 2</legend>
<label><span data-i18n="class">병종</span>
<select name="vehicle2Class"><option value="">-</option><option value="fighter">Fighter</option><option value="shooter">Shooter</option><option value="rider">Rider</option></select>
</label>
<div class="two-field">
<label><span data-i18n="power">전투력</span><input inputmode="decimal" min="0" name="vehicle2PowerValue" step="0.01" type="number"/></label>
<label><span data-i18n="unit">단위</span><select name="vehicle2PowerUnit"><option value="">-</option><option>M</option><option>G</option></select></label>
</div>
</fieldset>
<label class="season-war-field"><span data-i18n="seasonWar">시즌전 참여 가능 여부</span>
<select name="seasonWarAvailable"><option value="">-</option><option data-i18n="yes" value="1">가능</option><option data-i18n="no" value="0">불가능</option></select>
</label>
<label class="bgb-time-field">
<span data-i18n="bgbHour">BGB 참여 가능 시간대</span>
<small class="field-help" data-i18n="serverTimeBasis">서버 시간 기준</small>
<div class="server-time-live"><span data-i18n="currentServerTime">현재 서버 시간</span> <strong id="currentServerTime">--:--</strong></div>
<select id="bgbHourSelect" name="bgbAvailableHour"><option value="">-</option></select>
</label>
<label><span data-i18n="discordOptional">Discord (선택사항)</span><input autocomplete="off" maxlength="100" name="discord" type="text"/></label>
<label><span data-i18n="telegramOptional">Telegram (선택사항)</span><input autocomplete="off" maxlength="100" name="telegram" type="text"/></label>
<div class="spec-action-row">
<button class="portal-button portal-button-primary form-submit spec-save-button" data-i18n="saveSpecs" type="submit">저장</button>
<button class="portal-button portal-button-primary form-submit secondary-action spec-reset-button" data-i18n="resetSpecs" id="specsResetButton" type="button">초기화</button>
</div>
</form>
</div>
</article></div></section><section class="my-menu-group" data-group="activity"><h2 class="my-menu-group-title">활동</h2><div class="portal-card my-menu-group-card"><article class="accordion-item" data-section="requests">
<button aria-expanded="false" class="accordion-trigger" type="button">
<span><span aria-hidden="true" class="menu-svg-icon icon-document"></span><span id="myRequestsLabel">내 요청글</span></span>
<span class="chevron">›</span>
</button>
<div class="accordion-panel" hidden="">
<div class="my-request-list" id="myRequestsList"></div>
<a class="portal-button portal-button-primary form-submit my-request-board-link" href="../request/" id="myRequestsOpenBoard">요청 게시판 열기</a>
</div>
</article></div></section><section class="my-menu-group" data-group="account"><h2 class="my-menu-group-title">계정 설정</h2><div class="portal-card my-menu-group-card"><article class="accordion-item" data-section="nickname">
<button aria-expanded="false" class="accordion-trigger" type="button">
<span><span aria-hidden="true" class="menu-svg-icon icon-edit"></span><span data-i18n="changeNickname">닉네임 변경</span></span>
<span class="chevron">›</span>
</button>
<div class="accordion-panel" hidden="">
<form class="portal-form form-stack" id="nicknameForm">
<div class="current-value"><span data-i18n="currentNickname">현재 닉네임</span><strong id="currentNickname">-</strong></div>
<div class="nickname-status">
<span data-i18n="changeStatus">변경 상태</span>
<strong class="status-badge available" id="nicknameBadge">🟢 지금 변경 가능</strong>
</div>
<div class="current-value" hidden="" id="nextChangeRow">
<span data-i18n="nextAvailable">다음 변경 가능일</span><strong id="nextChangeAt">-</strong>
</div>
<label><span data-i18n="newNickname">새 닉네임</span><input id="nicknameInput" maxlength="64" name="nickname" required="" type="text"/></label>
<p class="form-note nickname-change-note" data-i18n="nicknameChangeNote">닉네임 변경 후 7일 동안 다시 변경할 수 없습니다.</p>
<button class="portal-button portal-button-primary form-submit" data-i18n="changeNicknameButton" id="nicknameSubmit" type="submit">닉네임 변경</button>
</form>
</div>
</article><article class="accordion-item" data-section="password">
<button aria-expanded="false" class="accordion-trigger" type="button">
<span><span aria-hidden="true" class="menu-svg-icon icon-lock"></span><span data-i18n="changePassword">비밀번호 변경</span></span>
<span class="chevron">›</span>
</button>
<div class="accordion-panel" hidden="">
<form class="portal-form form-stack" id="passwordForm">
<label><span data-i18n="currentPassword">현재 비밀번호</span><input autocomplete="current-password" name="currentPassword" required="" type="password"/></label>
<label><span data-i18n="newPassword">새 비밀번호</span><input autocomplete="new-password" name="newPassword" required="" type="password"/></label>
<label><span data-i18n="confirmPassword">새 비밀번호 확인</span><input autocomplete="new-password" name="newPasswordConfirm" required="" type="password"/></label>
<p class="form-note" data-i18n="passwordNote">비밀번호 변경 후 다시 로그인해야 합니다.</p>
<button class="portal-button portal-button-primary form-submit" data-i18n="changePasswordButton" type="submit">비밀번호 변경</button>
</form>
</div>
</article></div></section></section>
</div>
</main>
<dialog aria-labelledby="specsResetTitle" class="confirm-dialog" id="specsResetDialog">
<form class="confirm-dialog-card" method="dialog">
<p data-i18n="resetConfirm" id="specsResetTitle">세부 스펙을 모두 초기화하시겠습니까?</p>
<div class="confirm-dialog-actions">
<button class="portal-button portal-button-secondary dialog-button dialog-cancel" data-i18n="cancel" value="cancel">취소</button>
<button class="portal-button portal-button-danger dialog-button dialog-danger" data-i18n="resetSpecs" id="specsResetConfirm" type="button" value="default">초기화</button>
</div>
</form>
</dialog>
<div aria-live="polite" class="toast" hidden="" id="toast" role="status"></div>
<script src="../vehicle-power.js?v=2740"></script>
<script src="./my.js?v=2930"></script>
</body>
</html>
